services:
  monitor:
    build: .
    container_name: network-monitor
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/monitor.db
    volumes:
      - monitor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  monitor-data: